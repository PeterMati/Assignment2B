<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <div class="brand">
          <span class="brand-icon">🌽</span>
          <h1>Smart Agriculture</h1>
        </div>
        <div class="header-status">
          Current Entries: <span id="entry-count" class="entry-count">0</span>
        </div>
      </div>
    </header>

    <main class="site-container">
      <section class="panel sensors-panel">
        <h2 class="panel-title">Enter Sensor Readings</h2>

        <div
          id="form-error-banner"
          class="alert alert-danger hidden"
          role="alert"
        ></div>

        <form action="#" id="sensors-form" novalidate>
          <div class="form-group">
            <label for="bay-name" class="form-label"
              >Bay Name <span class="required">*</span></label
            >
            <input
              type="text"
              name="bay-name"
              id="bay-name"
              class="form-control"
              placeholder="e.g. John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label for="ph" class="form-label"
              >pH <span class="required">*</span></label
            >
            <input
              type="number"
              name="ph"
              id="ph"
              class="form-control"
              min="0"
              max="14"
              step="0.1"
              placeholder="7"
              required
            />
          </div>

          <div class="form-group">
            <label for="ec" class="form-label"
              >Electrical Conductivity (mS/cm)
              <span class="required">*</span></label
            >
            <input
              type="number"
              name="ec"
              id="ec"
              class="form-control"
              min="0"
              max="20"
              step="0.1"
              placeholder="1.5"
              required
            />
          </div>

          <div class="form-group">
            <label for="temp" class="form-label"
              >Temp (°F) <span class="required">*</span></label
            >
            <input
              type="number"
              name="temp"
              id="temp"
              class="form-control"
              min="20"
              max="110"
              step="0.1"
              placeholder="67.7"
              required
            />
          </div>

          <div class="form-group">
            <label for="rh" class="form-label"
              >Relative Humidity (%) <span class="required">*</span></label
            >
            <input
              type="number"
              name="rh"
              id="rh"
              class="form-control"
              min="0"
              max="100"
              step="0.1"
              placeholder="60"
              required
            />
          </div>

          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Add Card
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
